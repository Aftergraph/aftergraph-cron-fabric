# Canonical source map. Every drift job compares against one artifact owner,
# never a global canonical repo. Research-owned terminology stays research-owned.
contracts:
  - id: organization.topology
    canonical_repo: Aftergraph/after-graph-governance
    artifact: slow-changing platform repository topology
    path: docs/platform-topology/1.0.json
    mirrors: []
  - id: mission.lifecycle
    canonical_repo: Aftergraph/runtime
    artifact: lifecycle version registry
    path: packages/invariants/src/registry.ts
    mirrors: [Aftergraph/docs]
  - id: execution.budget
    canonical_repo: Aftergraph/works-execution
    artifact: WorkGraph budget schema
    path: contracts/schemas/kernel.budget.schema.json
    mirrors: [Aftergraph/docs]
  - id: authority.delegation
    canonical_repo: Aftergraph/trust-gateway
    artifact: delegation/policy chain
    paths:
      - src/gateway/delegation-chain.js
      - src/gateway/policy.js
    mirrors: [Aftergraph/docs]
  - id: aie.terminology
    canonical_repo: Aftergraph/aie
    artifact: AIE term definitions
    status: research
    mirrors: []
  - id: governance.terms
    canonical_repo: Aftergraph/after-graph-governance
    artifact: cross-repo terminology + contracts
    mirrors: [Aftergraph/docs]
  - id: wi.observation
    canonical_repo: Aftergraph/wi-backend
    artifact: observation boundary contract + API schema
    paths:
      - contracts/work-intelligence-boundary/1.0.json
      - openapi.json
    mirrors: [Aftergraph/wi-frontend]
    mirror_paths:
      Aftergraph/wi-frontend:
        - src/api/contracts.ts
        - src/api/client.ts
  - id: studio.surface
    canonical_repo: Aftergraph/studio
    artifact: mission status surface contract
    mirrors: []
  - id: brand.identity
    canonical_repo: Aftergraph/brand
    artifact: Brand OS manifest + usage rules + SVG masters
    mirrors: []
