name: ag-fabric-canary
schedule: every month on the 1st at 9am
deliver: telegram-ops-topic
severity: info
allowed_dispositions: [store, digest]
read_only: true
mode: no_agent
job_type: script_only
detection_slo: {p50_max: 24h, p95_max: 48h}
rollback: cronjob_manage update job_id pause (list first)
script: scripts/sensors/canary.py
# State-canary only: proves atomic EventStore claim/dedupe/resolution/re-arm.
# It does NOT claim scheduler -> transport -> Telegram exactly-once delivery.
# A separate receipt-observing delivery canary is required for that claim.
