name: ag-runtime-paritet
schedule: every 2h
deliver: telegram-ops-topic
severity: warning
allowed_dispositions: [digest, notify]
read_only: true
mode: agent
job_type: constrained_terminal
detection_slo: {p50_max: 2h, p95_max: 4h}
rollback: cronjob_manage update job_id pause (list first)
script: scripts/sensors/runtime_change.py
monitor: true
prompt: |
  Semantic runtime parity investigator. The pre-check script output is a
  CHANGE GATE only: a changed blob SHA is NOT itself drift and MUST NOT
  trigger Telegram. On a changed fingerprint, use scripts/gh-read.sh
  (GET only) to inspect the exact artifacts and contracts/sources.yaml.
  Evaluate only registered relationships for mission.lifecycle,
  execution.budget and authority.delegation; do not require unrelated
  owner domains to be byte-identical. Emit notify only when an actual
  contract/semantic incompatibility, missing canonical artifact, or stale
  registered mirror is evidenced. Claim real findings atomically with
  EventStore.claim_event(); same finding fingerprint is silent. If the
  changed artifacts remain compatible, output nothing. Never merge, push,
  deploy, approve, delete, write to any repo, or read secrets.
continuity: true
enabled_toolsets: [terminal]
