name: ag-governance-drift
schedule: every 6h
deliver: telegram-ops-topic
severity: warning
allowed_dispositions: [digest, notify]
read_only: true
mode: agent
job_type: constrained_terminal
detection_slo: {p50_max: 6h, p95_max: 12h}
rollback: cronjob_manage update job_id pause (list first)
prompt: |
  Read-only governance drift check. First establish topology truth:
  fetch the live Aftergraph repository list via scripts/gh-read.sh (GET
  only) and compare repository identity, visibility and canonical branch
  against contract organization.topology in contracts/sources.yaml
  (Aftergraph/after-graph-governance docs/platform-topology/1.0.json).
  Classify temporary/incubation repos explicitly; repo existence MUST NOT
  upgrade maturity or authority. Only after topology is current, inspect
  the remaining contracts/sources.yaml entries against their declared
  canonical owners and mirrors. aie.terminology stays research-owned by
  AIE and must not be normalized to governance terminology. Use
  EventStore.claim_event() for actual findings; same fingerprint is silent.
  Emit only evidenced topology/ownership/contract drift, not ordinary repo
  churn. Never merge, push, deploy, approve, delete, write to repos, or
  read secrets.
continuity: true
enabled_toolsets: [terminal]
